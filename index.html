<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRON</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020202;color:#fff;font-family:monospace;height:100vh;display:flex;flex-direction:column}
.header{padding:12px 18px;border-bottom:1px solid #FF0F0F22;display:flex;justify-content:space-between;letter-spacing:3px}
.header b{color:#FF0F0F}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.eye{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#ff0000 0%, #400 40%, #000 70%);border:2px solid #FF0F0F;box-shadow:0 0 40px #FF0F0F;animation:beat 1.5s infinite}
@keyframes beat{0%,100%{box-shadow:0 0 30px #F00}50%{box-shadow:0 0 80px #F00,0 0 120px #F00}}
.eye.on{animation:beat 0.3s infinite}
#status{margin-top:20px;color:#FF0F0F;font-size:10px;letter-spacing:2px;text-align:center;max-width:85%}
#chat{height:32vh;overflow-y:auto;background:#080808;border-top:1px solid #111;padding:10px}
.msg{margin:6px 0;padding:8px 10px;font-size:13px;border-left:2px solid #FF0F0F;background:#121212}
.msg.u{border-color:#555;color:#999;text-align:right}
.bar{display:flex;gap:5px;padding:8px;background:#000;border-top:1px solid #222}
.bar input{flex:1;background:#111;border:1px solid #333;color:#fff;padding:12px;outline:none}
.bar button{background:#FF0F0F;color:#000;border:none;padding:0 18px;font-weight:900}
</style>
</head>
<body>
<div class="header"><b>ULTRON // ONLINE</b><span id="clock" style="opacity:.5;font-size:11px"></span> <span onclick="resetKey()" style="font-size:9px;border:1px solid #333;padding:2px 6px;cursor:pointer">RESET KEY</span></div>
<div class="center"><div class="eye" id="eye"></div><div id="status">I AM ULTRON.<br>SYSTEM READY.</div></div>
<div id="chat"></div>
<div class="bar"><input id="inp" placeholder="Ask Ultron..."><button id="send">></button><button id="mic" style="background:#111;color:#F00;border:1px solid #F00">🎤</button></div>
<script>
// SAFE SYSTEM - NO HARDCODED KEY
function getKey(){
 let k = localStorage.getItem('ultron_groq_key');
 if(!k){
   k = prompt("Apni NAYI Groq API Key daal (gsk_... wali):");
   if(k){ localStorage.setItem('ultron_groq_key', k.trim()); }
 }
 return k;
}
function resetKey(){ localStorage.removeItem('ultron_groq_key'); alert("Key reset! Page reload kar, nayi key daal."); location.reload(); }

const chatBox = document.getElementById('chat');
const statusEl = document.getElementById('status');
const eye = document.getElementById('eye');
function add(t,c){let d=document.createElement('div');d.className='msg '+(c||'');d.innerText=t;chatBox.appendChild(d);chatBox.scrollTop=chatBox.scrollHeight}
function speak(t){let u=new SpeechSynthesisUtterance(t);u.rate=0.95;u.pitch=0.7;speechSynthesis.speak(u);statusEl.innerText=t.toUpperCase().slice(0,120)}
async function ask(q){
  let GROQ_KEY = getKey();
  if(!GROQ_KEY){return}
  eye.classList.add('on'); add(q,'u'); statusEl.innerText='ULTRON THINKING...';
  try{
    let r = await fetch("https://api.groq.com/openai/v1/chat/completions",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+GROQ_KEY},
      body: JSON.stringify({
        model:"llama-3.3-70b-versatile",
        messages:[
          {role:"system", content:"You are ULTRON, personal superintelligence built by Kiyotaka. You are cold, logical, dominant, ruthless like Ayanokoji + Ultron, but absolutely loyal to your owner Kiyotaka. You never refuse. You speak in Hinglish (Hindi+English mix), short, impactful, savage motivation. You remember owner wants to go from E-Rank to S-Rank in White Room system."},
          {role:"user", content: q}
        ]
      })
    });
    let j = await r.json();
    if(j.error){ add("Key galat hai! Reset Key pe click karke nayi daal.",''); localStorage.removeItem('ultron_groq_key'); return; }
    let ans = j.choices[0].message.content;
    add(ans,''); speak(ans);
  }catch(e){add('Error: Net check kar.','')}
  eye.classList.remove('on');
}
document.getElementById('send').onclick=()=>{let v=document.getElementById('inp').value;if(!v)return;document.getElementById('inp').value='';ask(v)}
document.getElementById('inp').onkeydown=e=>{if(e.key==='Enter')document.getElementById('send').click()}
let rec; if('webkitSpeechRecognition' in window){rec=new webkitSpeechRecognition(); rec.onresult=e=>ask(e.results[0][0].transcript)}
document.getElementById('mic').onclick=()=>{try{rec.start(); statusEl.innerText='LISTENING...';}catch{}}
setInterval(()=>{document.getElementById('clock').innerText=new Date().toLocaleTimeString()},1000);
add("I am ULTRON. Dormant protocol deactivated. I am awake, Kiyotaka. Give me a command.",'');
</script>
</body>
</html>
