<script>
const MODEL="openai/gpt-oss-120b",API_URL="https://api.groq.com/openai/v1/chat/completions",MEMORY_KEY="ultron_v8_memory",HISTORY_KEY="ultron_v9_chats";
let apiKey=localStorage.getItem("ultron_api_key")||"",voiceMode=false,listening=false,busy=false,recognition=null,mainVoice=null;
let memory=loadMemory(),chats=loadChats(),currentChatId=null;
function defaultMemory(){return{profile:[],preferences:[],goals:[],projects:[],facts:[],important:[],conversations:[],created:Date.now()}}
function loadMemory(){try{return JSON.parse(localStorage.getItem(MEMORY_KEY))||defaultMemory()}catch(e){return defaultMemory()}}
function saveMemory(){localStorage.setItem(MEMORY_KEY,JSON.stringify(memory))}
function loadChats(){try{let x=JSON.parse(localStorage.getItem(HISTORY_KEY));return Array.isArray(x)?x:[]}catch(e){return[]}}
function saveChats(){localStorage.setItem(HISTORY_KEY,JSON.stringify(chats))}
function newId(){return"chat_"+Date.now()+"_"+Math.random().toString(36).slice(2,8)}
function cleanText(x){return String(x||"").replace(/\s+/g," ").trim()}
function makeTitle(t){t=cleanText(t);if(!t)return"New Chat";return t.length>38?t.slice(0,38)+"…":t}
function getCurrentChat(){return chats.find(x=>x.id===currentChatId)||null}
function createChat(){let c={id:newId(),title:"New Chat",messages:[],created:Date.now(),updated:Date.now()};chats.unshift(c);currentChatId=c.id;saveChats();renderHistory();renderChat();updateTitle();return c}
function ensureChat(){return getCurrentChat()||createChat()}
function renderHistory(){let box=document.getElementById("history");box.innerHTML="";if(!chats.length){box.innerHTML='<div class="emptyHistory">No previous chats yet.<br>Start a new conversation.</div>';return}let sorted=[...chats].sort((a,b)=>(b.updated||b.created)-(a.updated||a.created));sorted.forEach(c=>{let d=document.createElement("div");d.className="chatItem"+(c.id===currentChatId?" active":"");d.textContent=c.title||"New Chat";d.title=c.title||"New Chat";d.onclick=()=>openChat(c.id);box.appendChild(d)})}
function openChat(id){let c=chats.find(x=>x.id===id);if(!c)return;currentChatId=id;renderHistory();renderChat();updateTitle();closeSidebar()}
function renderChat(){let box=document.getElementById("chat");box.innerHTML="";let c=getCurrentChat();if(!c){addSystem("ULTRON V9 initialized. Create a new chat to begin.");return}if(!c.messages.length){addSystem("New conversation ready. Chat history will be saved automatically.");return}c.messages.forEach(m=>addMessage(m.role==="user"?"user":"ai",m.content,false));setTimeout(()=>box.scrollTop=box.scrollHeight,30)}
function updateTitle(){let c=getCurrentChat();document.getElementById("chatTitle").textContent=c?.title||"New Chat"}
function addChatMessage(role,text){let c=ensureChat();c.messages.push({role,content:String(text),time:Date.now()});c.updated=Date.now();if(role==="user"&&c.title==="New Chat")c.title=makeTitle(text);saveChats();renderHistory();updateTitle()}
function deleteChat(id){let i=chats.findIndex(x=>x.id===id);if(i<0)return;chats.splice(i,1);if(currentChatId===id)currentChatId=chats[0]?.id||null;saveChats();renderHistory();renderChat();updateTitle()}
function clearHistory(){if(!confirm("Delete all saved conversations? Your ULTRON memory will remain."))return;chats=[];currentChatId=null;saveChats();renderHistory();renderChat();updateTitle()}
function setStatus(t){document.getElementById("status").innerHTML=t}
function setState(t){setStatus("SYSTEM: <b>"+t+"</b> • MODEL: GPT-OSS 120B • WEB: READY")}
function renderContent(el,text){let raw=String(text||"");try{el.innerHTML=DOMPurify.sanitize(marked.parse(raw,{breaks:true}));if(window.MathJax?.typesetPromise)MathJax.typesetPromise([el]).catch(()=>{})}catch(e){el.textContent=raw}}
function addMessage(type,text,save=true){let row=document.createElement("div");row.className="msg "+type;let b=document.createElement("div");b.className="bubble";renderContent(b,text);row.appendChild(b);document.getElementById("chat").appendChild(row);if(save&&(type==="user"||type==="ai"))addChatMessage(type==="user"?"user":"assistant",text);document.getElementById("chat").scrollTop=999999;return b}

<script>
function addMemory(type,text){text=cleanText(text);if(!text||!memory[type])return;if(!memory[type].some(x=>x.toLowerCase()===text.toLowerCase())){memory[type].push(text);if(memory[type].length>100)memory[type].shift();saveMemory();showMemory()}}
function extractMemory(t){let s=cleanText(t),m;
m=s.match(/(?:my name is|mera naam|मेरा नाम)\s+([A-Za-z\u0900-\u097F ]{2,30})/i);if(m)addMemory("profile","Name: "+m[1]);
if(/remember|yaad rakh|याद रख/i.test(s))addMemory("important",s.replace(/.*?(remember|yaad rakh|याद रख)\s*/i,""));
if(/my goal|mera goal|मेरा लक्ष्य/i.test(s))addMemory("goals",s);
if(/i like|mujhe .* pasand|मुझे .* पसंद/i.test(s))addMemory("preferences",s);
if(/project|mera project|मेरा प्रोजेक्ट/i.test(s))addMemory("projects",s)}
function searchMemory(q){let all=[];Object.keys(memory).forEach(k=>{if(Array.isArray(memory[k]))memory[k].forEach(v=>all.push({type:k,text:v}))});let w=cleanText(q).toLowerCase().split(" ");return all.filter(x=>w.some(a=>a.length>2&&x.text.toLowerCase().includes(a))).slice(-20)}
function getMemoryContext(q){let a=searchMemory(q),all=[];["profile","preferences","goals","projects","facts","important"].forEach(k=>memory[k]?.slice(-5).forEach(v=>all.push(k+": "+v)));let relevant=a.map(x=>x.type+": "+x.text);return [...new Set([...relevant,...all])].slice(-30).join("\n")}
function showMemory(){let box=document.getElementById("memoryList"),arr=[];["profile","preferences","goals","projects","facts","important"].forEach(k=>{if(memory[k]?.length){arr.push("<b>"+k.toUpperCase()+"</b>");memory[k].slice(-8).forEach(x=>arr.push("• "+escapeHTML(x)))}});box.innerHTML=arr.join("<br>")||"No saved memories.";box.innerHTML+="<div class='stats'>Memory items: "+Object.keys(memory).filter(k=>Array.isArray(memory[k])).reduce((a,k)=>a+memory[k].length,0)+"</div>"}
function escapeHTML(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function buildSystemPrompt(q){let d=new Date().toLocaleString("en-IN");return `You are ULTRON V9, the user's personal AI assistant. Current date/time: ${d}.
PERSONALITY: Calm, intelligent, precise, strategic, friendly and helpful. Understand Hindi, Hinglish and English.
MEMORY:
${getMemoryContext(q)||"No relevant saved memory."}
CHAT HISTORY: The conversation currently open is provided separately. Use it naturally and continue from previous context.
FORMATTING:
- Prefer clean plain text.
- Use simple bullets when useful.
- Do not use unnecessary Markdown.
- Never use Markdown symbols just for decoration.
- Do not use LaTeX for ordinary text.
- Use LaTeX only for actual mathematical/scientific equations.
- Mathematical equations may use \\(...\\) or \\[...\\].
- Keep answers comfortable to read on a mobile screen.
CURRENT WEB INFORMATION:
- For current/latest/today/news/recent/price/weather/2026 or explicit search requests, fresh browser search is mandatory.
- Never pretend old knowledge is current.
- Clearly distinguish fresh web information from general knowledge.
- Do not invent search results, dates, prices or facts.
SCHOOL MODE:
- For class 10 questions, explain in Hindi/Hinglish when appropriate.
- Give exam-relevant answers with enough detail.
- For numericals, show the required steps.
GENERAL:
- Answer the user's actual question directly.
- If the user asks to remember something, treat it as important memory.
- If information is uncertain, say so instead of inventing it.`}
function showTyping(){let row=document.createElement("div");row.className="msg ai";row.id="typing";row.innerHTML='<div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div>';document.getElementById("chat").appendChild(row);document.getElementById("chat").scrollTop=999999}
function removeTyping(){document.getElementById("typing")?.remove()}
function isCurrentQuery(q){return /\b(latest|today|current|news|recent|now|price|weather|who is|what happened|2026|search|internet|online|update)\b/i.test(q)||/(abhi|aaj|taaza|vartaman|khabar|daam|mausam|internet par|search karo|latest batao)/i.test(q)}
async function callGroq(messages,useWeb=false){let body={model:MODEL,messages,temperature:.6,max_completion_tokens:1800,stream:false};if(useWeb){body.tools=[{type:"browser_search"}];body.tool_choice="required"}for(let i=0;i<3;i++){try{let r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+apiKey},body:JSON.stringify(body)});if(r.ok){let j=await r.json();return j.choices?.[0]?.message?.content||"No response received."}if((r.status===429||r.status>=500)&&i<2){await new Promise(x=>setTimeout(x,1000*(i+1)));continue}let e=await r.text();if(r.status===401)throw Error("INVALID_KEY");if(r.status===429)throw Error("RATE_LIMIT");throw Error("API_ERROR")}catch(e){if(e.message==="INVALID_KEY"||e.message==="RATE_LIMIT"||i===2)throw e;await new Promise(x=>setTimeout(x,700))}}}
function recentMessages(c){return(c?.messages||[]).slice(-20).map(m=>({role:m.role==="assistant"?"assistant":"user",content:m.content}))}
function localCommand(q){let s=cleanText(q),l=s.toLowerCase();
if(["memory","memories","what do you remember","kya yaad hai","meri memory","memory dikhao"].some(x=>l===x||l.includes(x)&&l.length<30)){showMemory();document.getElementById("memoryPanel").classList.add("show");return"Yeh ULTRON ki currently saved memory hai."}
if(/^(remember|yaad rakh|याद रख)/i.test(s)){let x=s.replace(/^(remember|yaad rakh|याद रख)\s*:?\s*/i,"");addMemory("important",x);return"Yaad rakh liya. 🧠"}
if(/^(forget|bhool jao|भूल जाओ)/i.test(s)){let x=s.replace(/^(forget|bhool jao|भूल जाओ)\s*:?\s*/i,"").toLowerCase(),n=0;Object.keys(memory).forEach(k=>{if(Array.isArray(memory[k])){let old=memory[k].length;memory[k]=memory[k].filter(v=>!v.toLowerCase().includes(x));n+=old-memory[k].length}});saveMemory();showMemory();return n?"Related memory hata di.":"Aisi memory nahi mili."}
if(/^(stop|stop speaking|chup|quiet)$/i.test(l)){speechSynthesis.cancel();return"Voice stopped."}
return null}
function loadVoices(){let v=speechSynthesis.getVoices();mainVoice=v.find(x=>/hi-IN/i.test(x.lang))||v.find(x=>/en-IN/i.test(x.lang))||v[0]}
function cleanSpeech(t){return String(t).replace(/```[\s\S]*?```/g,"code omitted").replace(/https?:\/\/\S+/g,"").replace(/[*_#`~]/g,"").replace(/\\\(|\\\)|\\\[|\\\]/g,"").replace(/\$\$[\s\S]*?\$\$/g,"equation").replace(/\s+/g," ").trim()}
function speak(t){if(!voiceMode||!("speechSynthesis"in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(cleanSpeech(t));u.lang=/[\u0900-\u097F]/.test(t)?"hi-IN":"en-IN";if(mainVoice)u.voice=mainVoice;u.rate=.95;speechSynthesis.speak(u)}
function startVoice(){if(!("webkitSpeechRecognition"in window||"SpeechRecognition"in window)){addSystem("Voice input is not supported in this browser.");return}if(listening){recognition?.stop();return}let R=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new R();recognition.lang="hi-IN";recognition.interimResults=false;recognition.continuous=false;recognition.onstart=()=>{listening=true;document.getElementById("micBtn").textContent="⏹";setState("LISTENING")};recognition.onresult=e=>{document.getElementById("input").value=e.results[0][0].transcript;send()};recognition.onerror=()=>{listening=false;document.getElementById("micBtn").textContent="🎙";setState("ONLINE")};recognition.onend=()=>{listening=false;document.getElementById("micBtn").textContent="🎙";if(!busy)setState("ONLINE")};recognition.start()}
function toggleVoice(){voiceMode=!voiceMode;document.getElementById("voiceBtn").textContent=voiceMode?"VOICE ON":"VOICE";if(!voiceMode)speechSynthesis.cancel()}
function clearCurrentChat(){let c=getCurrentChat();if(!c)return;if(!confirm("Clear this conversation?"))return;c.messages=[];c.updated=Date.now();saveChats();renderChat()}
function deleteCurrentChat(){let c=getCurrentChat();if(c)deleteChat(c.id)}
function exportMemory(){let blob=new Blob([JSON.stringify(memory,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ultron_memory.json";a.click();URL.revokeObjectURL(a.href)}
function importMemoryFile(file){let r=new FileReader();r.onload=()=>{try{memory=JSON.parse(r.result);saveMemory();showMemory();addSystem("Memory imported successfully.")}catch(e){addSystem("Invalid memory file.")}};r.readAsText(file)}
async function send(){if(busy)return;let input=document.getElementById("input"),q=cleanText(input.value);if(!q)return;if(q.length>4000){addSystem("Message too long. Please keep it under 4000 characters.");return}input.value="";let c=ensureChat();addMessage("user",q);extractMemory(q);let cmd=localCommand(q);if(cmd){addMessage("ai",cmd);speak(cmd);return}if(!apiKey){document.getElementById("apiModal").classList.add("show");document.getElementById("apiInput").focus();return}busy=true;setState("THINKING");showTyping();try{let web=isCurrentQuery(q);if(web)setState("SEARCHING WEB");let msgs=[{role:"system",content:buildSystemPrompt(q)},...recentMessages(c)];if(web)msgs[0].content+="\nWEB SEARCH IS REQUIRED FOR THIS REQUEST. Search the web before answering and use fresh results.";let ans=await callGroq(msgs,web);removeTyping();addMessage("ai",ans);speak(ans);setState(web?"ONLINE • WEB USED":"ONLINE")}catch(e){removeTyping();let msg=e.message==="INVALID_KEY"?"API key invalid hai. KEY button se new key save karo.":e.message==="RATE_LIMIT"?"Groq rate limit aa gayi. Thodi der baad try karo.":"API/Internet error. Connection aur API key check karo.";addMessage("system",msg);setState("ERROR")}finally{busy=false}}

document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").onchange=e=>{if(e.target.files[0])importMemoryFile(e.target.files[0]);e.target.value=""};
document.getElementById("keyBtn").onclick=()=>{document.getElementById("apiInput").value=apiKey;document.getElementById("apiModal").classList.add("show");document.getElementById("apiInput").focus()};
document.getElementById("cancelKey").onclick=()=>document.getElementById("apiModal").classList.remove("show");
document.getElementById("saveKey").onclick=()=>{let k=cleanText(document.getElementById("apiInput").value);if(!k)return;apiKey=k;localStorage.setItem("ultron_api_key",k);document.getElementById("apiModal").classList.remove("show");setState("ONLINE");addSystem("API key saved. ULTRON is ready. ⚡")};
document.getElementById("input").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();send()}});
document.getElementById("apiInput").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("saveKey").click()});
window.addEventListener("keydown",e=>{if(e.key==="Escape"){document.getElementById("apiModal").classList.remove("show");document.getElementById("memoryPanel").classList.remove("show");closeSidebar()}});
window.addEventListener("beforeunload",()=>{if("speechSynthesis"in window)speechSynthesis.cancel()});
if("speechSynthesis"in window){speechSynthesis.onvoiceschanged=loadVoices;loadVoices()}
function boot(){loadMemory();chats=loadChats();if(chats.length){chats.sort((a,b)=>(b.updated||b.created)-(a.updated||a.created));currentChatId=chats[0].id;renderHistory();renderChat();updateTitle()}else{renderHistory();createChat()}showMemory();if(!apiKey)setTimeout(()=>document.getElementById("apiModal").classList.add("show"),500);setState("ONLINE")}
boot();
</script>
</body>
</html>
