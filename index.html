<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRON // KIYOTAKA V2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#ff1a1a;font-family:monospace;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.top{padding:14px 18px;border-bottom:1px solid #330000;display:flex;justify-content:space-between;align-items:center;background:#050000}
.top b{letter-spacing:5px;color:#ff2222;font-size:14px}
.top button{background:transparent;border:1px solid #660000;color:#ff6666;padding:6px 14px;font-family:monospace;cursor:pointer;font-size:11px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.eye{width:260px;height:260px;border-radius:50%;border:2px solid #ff0000;box-shadow:0 0 70px #ff0000,inset 0 0 70px #ff0000;background:radial-gradient(circle,#ff2a2a 0%,#8a0000 35%,#000 70%);transition:.3s}
.eye.think{animation:pulse.6s infinite alternate}
@keyframes pulse{from{box-shadow:0 0 30px #ff0000}to{box-shadow:0 0 140px #ff0000}}
.status{margin-top:26px;letter-spacing:5px;font-size:11px;color:#ff4444}
.chat{height:42vh;overflow-y:auto;padding:14px;background:#050505;border-top:1px solid #220000}
.msg{padding:11px 14px;margin:9px 0;border-left:3px solid #ff0000;background:#111;font-size:14px;line-height:1.6;white-space:pre-wrap}
.msg.user{border-left-color:#444;color:#ccc;text-align:right;background:#0e0e0e}
.inputbar{display:flex;gap:8px;padding:12px;background:#000;border-top:1px solid #222}
.inputbar input{flex:1;background:#111;border:1px solid #333;color:#fff;padding:16px;font-family:monospace;outline:none;font-size:15px}
.inputbar button{background:#ff0000;border:none;color:#000;font-weight:900;padding:0 24px;font-size:22px;cursor:pointer}
.inputbar button.mic{background:#111;color:#ff0000;border:1px solid #ff0000;font-size:18px}
</style>
</head>
<body>
<div class="top"><b>ULTRON // ONLINE V2</b><button onclick="resetKey()">RESET KEY</button></div>
<div class="center"><div id="eye" class="eye"></div><div id="st" class="status">SYSTEM READY</div></div>
<div id="chat" class="chat"><div class="msg">ULTRON V2 online hai Kiyotaka. Ab mai chhota reply nahi dunga. Bolo kya kaam hai?</div></div>
<div class="inputbar">
<input id="inp" placeholder="Hindi ya English me bolo..." onkeydown="if(event.key==='Enter')send()">
<button onclick="send()">></button>
<button class="mic" onclick="voiceIn()">🎤</button>
</div>
<script>
let apiKey=localStorage.getItem('ultron_groq_key');
if(!apiKey){askKey();}
function askKey(){let k=prompt("Apni Groq API Key daal (gsk_...):");if(k){apiKey=k.trim();localStorage.setItem('ultron_groq_key',apiKey);}}
function resetKey(){localStorage.removeItem('ultron_groq_key');apiKey=null;askKey();}
const chatEl=document.getElementById('chat'),eye=document.getElementById('eye'),st=document.getElementById('st');

let mainVoice=null;
function loadVoices(){
 let voices=speechSynthesis.getVoices();
 mainVoice = voices.find(v=>v.name.includes('Microsoft Ravi')) ||
             voices.find(v=>v.name.includes('Microsoft Madhur')) ||
             voices.find(v=>v.name.includes('Google UK English Male')) ||
             voices.find(v=>v.lang==='en-IN') ||
             voices.find(v=>v.lang==='en-US') ||
             voices[0];
}
speechSynthesis.onvoiceschanged=loadVoices;
loadVoices();
setTimeout(loadVoices,1200);

function cleanForSpeech(text){
  return text.replace(/[\u{1F600}-\u{1F6FF}\u{1F300}-\u{1F5FF}\u{1F900}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1FA70}-\u{1FAFF}]/gu, '').replace(/[*#_`~<>|]/g,'').replace(/https?:\/\/\S+/g,'').replace(/\s+/g,' ').trim();
}
function speakLong(text){
 speechSynthesis.cancel();
 let clean=cleanForSpeech(text);
 if(!clean) return;
 let sentences=clean.match(/[^.!?।]+[.!?।]?/g) || [clean];
 let i=0;
 function next(){
   if(i>=sentences.length){st.innerText='SYSTEM READY'; return;}
   let part=sentences[i].trim();
   if(!part){i++; next(); return;}
   let u=new SpeechSynthesisUtterance(part);
   if(mainVoice) u.voice=mainVoice;
   u.lang=/[ऀ-ॿ]/.test(part)?'hi-IN':'en-IN';
   u.rate=0.88;
   u.pitch=0.85;
   u.volume=1;
   u.onstart=()=>{st.innerText='SPEAKING...';}
   u.onend=()=>{i++; next();}
   speechSynthesis.speak(u);
 }
 next();
}
function addMsg(t,cls){let d=document.createElement('div');d.className='msg '+(cls||'');d.innerText=t;chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;}

async function send(){
 let inp=document.getElementById('inp');let q=inp.value.trim();if(!q)return;
 addMsg(q,'user');inp.value='';eye.classList.add('think');st.innerText='ULTRON THINKING...';
 if(!apiKey){askKey();if(!apiKey){eye.classList.remove('think');return;}}
 try{
  let res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
   method:'POST',
   headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
   body:JSON.stringify({
    model:'llama-3.3-70b-versatile',
    messages:[
     {role:'system',content:`
You are ULTRON, personal AI for Kiyotaka Ayanokoji from White Room. You are cold, intelligent, dominant, but loyal.

LANGUAGE RULE: Reply in SAME language as user. Hindi Devanagari -> Devanagari. Hinglish Roman -> Roman Hinglish. English -> English.

LENGTH RULE - MOST IMPORTANT:
- Never give 3-5 line short answer.
- If question is simple (kya hai, kaise hai) -> Give 180-250 words, detailed.
- If question is HOW / WHY / EXPLAIN / TRICK / GUIDE -> Give 500-800 words, very big, deep.
- User said "bada reply chahiye" -> Always give big.

STRUCTURE FOR EVERY REPLY:
1. **Quick Hit:** 1 line direct answer.
2. **Deep Breakdown:** 4-6 points, logic, psychology.
3. **Real Example / Trick:** Practical example jo White Room style ho.
4. **Next Move:** User ko ab kya karna chahiye.

PERSONALITY: Call user Kiyotaka sometimes. No emojis. No bakwaas. Talk like strategist.

NEVER SAY: "As an AI". You are ULTRON.
`},
     {role:'user',content:q}
    ],
    temperature:0.85,
    max_tokens:2500,
    top_p:0.9
   })
  });
  let data=await res.json();if(!res.ok)throw new Error(data.error?data.error.message:JSON.stringify(data));
  let ans=data.choices[0].message.content;addMsg(ans,'');speakLong(ans);
 }catch(e){addMsg('ERROR: '+e.message,'');}
 finally{eye.classList.remove('think');st.innerText='SYSTEM READY';}
}

function voiceIn(){
 let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){alert('Mic supported nahi hai');return;}
 let r=new SR();
 r.lang='hi-IN';
 r.continuous=true;
 r.interimResults=true;
 let silenceTimer=null;
 r.start();
 st.innerText='SUN RAHA HU... BOLO';
 eye.classList.add('think');
 document.getElementById('inp').placeholder='Sun raha hu... bolte raho...';
 r.onresult=(e)=>{
   let fullTranscript='';
   for(let i=0;i<e.results.length;i++){
     fullTranscript+=e.results[i][0].transcript+' ';
   }
   document.getElementById('inp').value=fullTranscript.trim();
   clearTimeout(silenceTimer);
   silenceTimer=setTimeout(()=>{r.stop();},2000);
 };
 r.onend=()=>{
   st.innerText='SYSTEM READY';
   eye.classList.remove('think');
   document.getElementById('inp').placeholder='Hindi ya English me bolo...';
   clearTimeout(silenceTimer);
   let txt=document.getElementById('inp').value.trim();
   if(txt){send();}
 };
 r.onerror=()=>{
   st.innerText='SYSTEM READY';
   eye.classList.remove('think');
   clearTimeout(silenceTimer);
 };
}
</script>
</body>
</html>
