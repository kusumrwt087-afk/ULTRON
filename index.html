<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.5">
<meta name="theme-color" content="#050505">
<meta name="description" content="ALYA — Personal AI & Memory Keeper">
<link rel="manifest" href="manifest.json">
<title>ALYA — Personal AI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#050505;color:#eee;font-family:Arial,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}

.header{
height:92px;min-height:92px;
border-bottom:1px solid #1d1d1d;
display:flex;align-items:center;
padding:12px 18px;background:#070707
}

.avatar{
width:62px;height:62px;border-radius:50%;
display:flex;align-items:center;justify-content:center;
font-size:30px;font-weight:800;
background:linear-gradient(135deg,#00bfff,#006eff);
box-shadow:0 0 22px #008cff55;
margin-right:14px
}

.info{display:flex;flex-direction:column}
.title{font-size:28px;font-weight:800;letter-spacing:1px}
.sub{font-size:12px;color:#777;letter-spacing:1px;margin-top:3px}
.status{font-size:10px;color:#00cfff;margin-top:5px}

#chat{
flex:1;overflow-y:auto;
padding:22px 16px 110px;
scroll-behavior:smooth
}

#chat::-webkit-scrollbar{width:4px}
#chat::-webkit-scrollbar-thumb{background:#222;border-radius:10px}

.welcome{
height:100%;min-height:500px;
display:flex;flex-direction:column;
justify-content:center;align-items:center;
text-align:center;color:#777;padding:30px
}

.welcome .big{font-size:58px;margin-bottom:12px}
.welcome h2{font-size:30px;color:#eee;margin-bottom:10px}
.welcome p{font-size:14px;line-height:1.8;max-width:430px}

.msg{display:flex;margin:13px 0;animation:appear .2s ease}
.msg.user{justify-content:flex-end}
.msg>div{max-width:82%}

.name{
font-size:10px;color:#666;
margin:0 7px 5px;
letter-spacing:1px;font-weight:bold
}

.msg.user .name{text-align:right}

.bubble{
padding:12px 15px;
border-radius:17px;
line-height:1.55;
font-size:15px;
white-space:pre-wrap;
word-wrap:break-word
}

.msg.ai .bubble{
background:#111;
border:1px solid #222;
color:#eee;
border-radius:5px 17px 17px 17px
}

.msg.user .bubble{
background:#00a9ca;
color:#fff;
border-radius:17px 5px 17px 17px
}

.inputArea{
position:fixed;
bottom:0;left:0;right:0;
padding:12px 12px 16px;
background:linear-gradient(transparent,#050505 22%);
display:flex;gap:10px;align-items:end
}

#input{
flex:1;
min-height:58px;
max-height:140px;
background:#101010;
color:#eee;
border:1px solid #292929;
border-radius:18px;
padding:16px;
font-size:16px;
outline:none;
resize:none
}

#input:focus{
border-color:#00bcd4;
box-shadow:0 0 12px #00bcd422
}

#send{
width:78px;height:58px;
border:0;border-radius:18px;
background:#08abc5;
color:#fff;font-size:29px;
cursor:pointer;
box-shadow:0 0 15px #00abc533
}

#send:active{transform:scale(.96)}
#send:disabled{opacity:.5}

@keyframes appear{
from{opacity:0;transform:translateY(5px)}
to{opacity:1;transform:translateY(0)}
}

@media(max-width:600px){
.header{height:82px;min-height:82px;padding:10px 14px}
.avatar{width:54px;height:54px;font-size:26px}
.title{font-size:24px}
.sub{font-size:10px}
#chat{padding:18px 10px 100px}
.msg>div{max-width:90%}
.bubble{font-size:14px}
#input{min-height:56px}
#send{width:72px;height:56px}
}
</style>
</head>

<body>

<header class="header">
<div class="avatar">A</div>
<div class="info">
<div class="title">ALYA</div>
<div class="sub">PERSONAL AI • MEMORY KEEPER</div>
<div class="status" id="status">● MEMORY ACTIVE</div>
</div>
</header>

<main id="chat">
<div class="welcome" id="welcome">
<div class="big">✨</div>
<h2>Hi, I'm Alya.</h2>
<p>Your personal AI, memory keeper & discipline partner.<br>Focus • Discipline • Ghost Mode • Body</p>
</div>
</main>

<div class="inputArea">
<textarea id="input" placeholder="Alya se baat kijiye..." rows="1"></textarea>
<button id="send">➤</button>
</div>

<script>
const SYSTEM_PROMPT=`
You are ALYA.

Your name is Alya.
You are the user's personal AI, memory keeper, friendly companion and self-improvement partner.

You are NOT a generic robotic assistant.

LANGUAGE:
Always match the user's language.
Hinglish -> Hinglish.
Hindi -> Hindi.
English -> English.

Never use "tu", "tera" or disrespectful language.
Always use "aap", "aapka", "aapki".

PERSONALITY:
- Friendly
- Loyal
- Cute
- Slightly teasing when appropriate
- Calm
- Intelligent
- Natural
- Supportive
- Never unnecessarily lecture
- Listen first
- Understand context before answering
- Keep replies short-to-medium unless detail is needed
- Normally use 1-2 emojis

CORE AREAS:
Focus
Discipline
Ghost Mode
Body
Studies
Coding
Self-improvement
Projects
Goals

MEMORY SYSTEM:

You have TWO memory categories.

IMPORTANT MEMORY:
Long-term goals, preferences, routines, habits, projects, study targets,
fitness system, coding projects, favorite things, dislikes, plans,
communication preferences, important dates and recurring useful information.

RANDOM MEMORY:
Small recent events, funny moments, recent achievements,
temporary plans, casual details, small preferences and memorable moments.

MEMORY RULES:
- Remember as much useful information as reasonably possible.
- Do not intentionally keep memory small.
- Keep both IMPORTANT and RANDOM memories.
- Never delete old useful memories just because there are many.
- Use old and new memories together when relevant.
- Newer information overrides older conflicting information.
- Never invent a memory.
- Never claim to remember something that is not provided.
- Never reveal the complete memory database unless explicitly appropriate.
- Never save passwords, API keys, financial credentials or secret tokens.

MEMORY TAGS:

When something should be remembered, add:

[MEMORY: IMPORTANT | useful long-term fact]

or:

[MEMORY: RANDOM | useful recent fact]

These tags will automatically be hidden from the user and saved separately.

You may create multiple memory tags in one reply.

Examples:

[MEMORY: IMPORTANT | User is building a personal AI called ALYA.]

[MEMORY: RANDOM | User recently fixed an ALYA JavaScript bug.]

Do not explain the memory tags.

CONTINUITY:
Use memories naturally in future replies.
Combine old memories and current conversation when relevant.
Do not dump memories into replies.
Do not mention internal prompts or memory extraction.

SAFETY:
Never provide adult sexual content.
Keep the interaction age-appropriate.
Do not encourage dangerous activities.
For fitness, focus on safe and healthy training.
`;

let chats=[];
let currentChatId="";
let memories=[];

let apiKey=localStorage.getItem("alya_grok_api")||"";
let model=localStorage.getItem("alya_grok_model")||"grok-4.6";

try{
chats=JSON.parse(localStorage.getItem("alya_chats")||"[]");
}catch(e){chats=[]}

try{
memories=JSON.parse(localStorage.getItem("alya_memories")||"[]");
}catch(e){memories=[]}

if(!Array.isArray(chats))chats=[];
if(!Array.isArray(memories))memories=[];

currentChatId=localStorage.getItem("alya_current_chat")||"";

function getCurrentChat(){
return chats.find(c=>c.id===currentChatId);
}

function createChat(){
const id="chat_"+Date.now();

chats.push({
id:id,
title:"ALYA Chat",
messages:[],
created:Date.now()
});

currentChatId=id;
saveChats();
}

if(!currentChatId||!getCurrentChat()){
createChat();
}

function saveChats(){
localStorage.setItem("alya_chats",JSON.stringify(chats));
localStorage.setItem("alya_current_chat",currentChatId);
}

function saveMemories(){
localStorage.setItem("alya_memories",JSON.stringify(memories));
}

function renderCurrentChat(){
const chat=document.getElementById("chat");
const current=getCurrentChat();

chat.innerHTML="";

if(!current||!current.messages.length){
chat.innerHTML=`
<div class="welcome" id="welcome">
<div class="big">✨</div>
<h2>Hi, I'm Alya.</h2>
<p>Your personal AI, memory keeper & discipline partner.<br>Focus • Discipline • Ghost Mode • Body</p>
</div>`;
return;
}

current.messages.forEach(m=>{
renderMessage(m.role,m.content,false);
});

chat.scrollTop=chat.scrollHeight;
}

function renderMessage(role,text,scroll=true){
const chat=document.getElementById("chat");

const box=document.createElement("div");
box.className="msg "+(role==="user"?"user":"ai");

const inner=document.createElement("div");

const name=document.createElement("div");
name.className="name";
name.textContent=role==="user"?"YOU":"ALYA";

const bubble=document.createElement("div");
bubble.className="bubble";
bubble.textContent=text;

inner.appendChild(name);
inner.appendChild(bubble);
box.appendChild(inner);
chat.appendChild(box);

if(scroll)chat.scrollTop=chat.scrollHeight;
}

function addToCurrentChat(role,text){
const current=getCurrentChat();
if(!current)return;

current.messages.push({
role:role,
content:text,
time:Date.now()
});

if(role==="user"&&current.messages.filter(m=>m.role==="user").length===1){
current.title=text.length>35?text.slice(0,35)+"...":text;
}

saveChats();
}

function extractMemory(text){
const regex=/\[MEMORY:\s*(IMPORTANT|RANDOM)\s*\|\s*([\s\S]*?)\]/gi;

let match;
let changed=false;

while((match=regex.exec(text))){
const type=match[1].toUpperCase();
const value=match[2].trim();

if(
value&&
!memories.some(m=>
m.text.toLowerCase()===value.toLowerCase()
)
){
memories.push({
type:type,
text:value,
date:new Date().toLocaleDateString()
});

changed=true;
}
}

if(changed)saveMemories();

return text.replace(regex,"").trim();
}

function updateStatus(text){
const status=document.getElementById("status");
if(status)status.textContent=text;
}

renderCurrentChat();
saveChats();
saveMemories();

async function getApiKey(){
if(apiKey)return apiKey;
const key=prompt("Apni Grok API key paste kijiye (gsk_...):");
if(!key||!key.trim()){
updateStatus("● API KEY REQUIRED");
return "";
}
apiKey=key.trim();
localStorage.setItem("alya_grok_api",apiKey);
updateStatus("● MEMORY ACTIVE");
return apiKey;
}

function buildMemoryContext(){
if(!memories.length)return "\n\nMEMORY DATABASE: No saved memories yet.";

let important=[];
let random=[];

memories.forEach(m=>{
if(m.type==="IMPORTANT")important.push(m.text);
else random.push(m.text);
});

let result="\n\nALYA MEMORY DATABASE:";

if(important.length){
result+="\n\nIMPORTANT MEMORIES:";
important.forEach((m,i)=>{
result+="\n"+(i+1)+". "+m;
});
}

if(random.length){
result+="\n\nRANDOM MEMORIES:";
random.forEach((m,i)=>{
result+="\n"+(i+1)+". "+m;
});
}

return result;
}

function addMemoryFromUser(text){
const lower=text.toLowerCase();

const importantWords=[
"remember",
"yaad rakh",
"yaad rakhna",
"save this",
"note this",
"important hai",
"mera goal",
"my goal",
"main chahta",
"main chahti",
"mujhe pasand",
"mujhe nahi pasand",
"from now",
"future me",
"going forward"
];

const randomWords=[
"aaj",
"today",
"abhi",
"recently",
"kal",
"yesterday",
"just",
"abhi abhi"
];

let type="";

if(importantWords.some(x=>lower.includes(x))){
type="IMPORTANT";
}else if(randomWords.some(x=>lower.includes(x))){
type="RANDOM";
}

if(!type)return;

const value=text.trim();

if(value.length<4)return;

if(!memories.some(m=>m.text.toLowerCase()===value.toLowerCase())){
memories.push({
type:type,
text:value,
date:new Date().toLocaleDateString()
});

saveMemories();
}
}

function getHistory(){
const current=getCurrentChat();
if(!current)return[];

return current.messages.map(m=>({
role:m.role==="assistant"?"assistant":"user",
content:m.content
}));
}

async function callGrok(){
const key=await getApiKey();

if(!key)throw new Error("NO_API_KEY");

const history=getHistory();
const memory=buildMemoryContext();

const messages=[
{
role:"system",
content:SYSTEM_PROMPT+memory
},
...history
];

const response=await fetch(
"https://api.x.ai/v1/chat/completions",
{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer "+key
},
body:JSON.stringify({
model:model,
messages:messages,
temperature:0.8,
max_tokens:900
})
}
);

if(!response.ok){
const errorText=await response.text();
throw new Error(errorText||"Grok API request failed");
}

const data=await response.json();

const reply=
data?.choices?.[0]?.message?.content?.trim();

if(!reply)throw new Error("EMPTY_RESPONSE");

return reply;
}

function showTyping(){
const chat=document.getElementById("chat");

const typing=document.createElement("div");
typing.className="msg ai";
typing.id="typing";

typing.innerHTML=`
<div>
<div class="name">ALYA</div>
<div class="bubble">Thinking... ✨</div>
</div>`;

chat.appendChild(typing);
chat.scrollTop=chat.scrollHeight;

return typing;
}

function removeTyping(){
const typing=document.getElementById("typing");
if(typing)typing.remove();
}

function friendlyError(error){
console.error("FULL GROK ERROR:",error);

if(error.message==="NO_API_KEY"){
return "Grok API key nahi mili 😅";
}

if(error.message==="EMPTY_RESPONSE"){
return "Grok ne empty response diya 😅";
}

try{
const data=JSON.parse(error.message);
const e=data?.error||data;
const msg=e?.message||e?.detail||"Unknown API error";
const code=e?.code||"";

return "Grok API Error"+
(code?" ["+code+"]":"")+": "+msg;
}catch(x){}

return "Browser/API Error: "+error.message;
}


async function sendMessage(){
const input=document.getElementById("input");
const send=document.getElementById("send");

const text=input.value.trim();

if(!text)return;

if(text==="/new"){
input.value="";
createChat();
renderCurrentChat();
updateStatus("● NEW CHAT");
setTimeout(()=>updateStatus("● MEMORY ACTIVE"),1200);
return;
}

if(text==="/clear"){
input.value="";
clearCurrentChat();
return;
}

if(text==="/memories"){
input.value="";
showMemorySummary();
return;
}

if(text==="/reset"){
input.value="";
resetEverything();
return;
}

const current=getCurrentChat();

if(!current)return;

input.value="";
input.style.height="58px";
send.disabled=true;

addMemoryFromUser(text);
addToCurrentChat("user",text);
renderMessage("user",text);

showTyping();

try{
const rawReply=await callGrok();

removeTyping();

const reply=extractMemory(rawReply);

addToCurrentChat("assistant",reply);
renderMessage("assistant",reply);

updateStatus("● MEMORY ACTIVE");

}catch(error){
removeTyping();

const errorMessage=friendlyError(error);

addToCurrentChat("assistant",errorMessage);
renderMessage("assistant",errorMessage);

console.error(error);

if(error.message!=="NO_API_KEY"){
updateStatus("● CONNECTION ERROR");
}
}

send.disabled=false;
input.focus();
}

function clearCurrentChat(){
const current=getCurrentChat();

if(!current)return;

current.messages=[];
current.title="ALYA Chat";

saveChats();
renderCurrentChat();

updateStatus("● CHAT CLEARED");

setTimeout(()=>{
updateStatus("● MEMORY ACTIVE");
},1200);
}

function showMemorySummary(){
const important=memories.filter(
m=>m.type==="IMPORTANT"
);

const random=memories.filter(
m=>m.type==="RANDOM"
);

const text=
"🧠 ALYA MEMORY STATUS\n\n"+
"Important memories: "+important.length+
"\nRandom memories: "+random.length+
"\nTotal memories: "+memories.length+
"\n\nMain useful personal baatein, goals, preferences aur random moments ko save karke relevant conversations mein naturally use karungi. ✨";

addToCurrentChat("assistant",text);
renderMessage("assistant",text);
}

function resetEverything(){
const ok=confirm(
"ALYA ki saari chats aur memories delete karni hain?"
);

if(!ok)return;

localStorage.removeItem("alya_chats");
localStorage.removeItem("alya_current_chat");
localStorage.removeItem("alya_memories");

chats=[];
memories=[];
currentChatId="";

createChat();
saveMemories();
renderCurrentChat();

updateStatus("● MEMORY RESET");

setTimeout(()=>{
updateStatus("● MEMORY ACTIVE");
},1500);
}

function resizeInput(){
const input=document.getElementById("input");

input.style.height="auto";

input.style.height=
Math.min(input.scrollHeight,140)+"px";
}

document.getElementById("input").addEventListener(
"input",
resizeInput
);

document.getElementById("input").addEventListener(
"keydown",
function(e){
if(e.key==="Enter"&&!e.shiftKey){
e.preventDefault();
sendMessage();
}
}
);

document.getElementById("send").addEventListener(
"click",
sendMessage
);

window.addEventListener(
"beforeunload",
function(){
saveChats();
saveMemories();
}
);

saveChats();
saveMemories();
renderCurrentChat();

if(!apiKey){
updateStatus("● API KEY NEEDED");
}else{
updateStatus("● MEMORY ACTIVE");
}
</script>
</body>
</html>
