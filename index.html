<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050505">
<title>ALYA AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#050505;color:#eee;
 font-family:Arial,sans-serif;height:100vh;
 display:flex;flex-direction:column
}
header{
 height:62px;border-bottom:1px solid #222;
 display:flex;align-items:center;padding:0 16px;
 justify-content:space-between
}
.logo{display:flex;align-items:center;gap:10px}
.avatar{
 width:38px;height:38px;border-radius:50%;
 background:#151515;border:1px solid #333;
 display:grid;place-items:center;font-size:19px
}
.name{font-weight:bold;font-size:18px}
.status{font-size:11px;color:#777;margin-top:2px}
#chat{
 flex:1;overflow-y:auto;padding:18px 12px;
 scroll-behavior:smooth
}
.msg{
 max-width:82%;padding:11px 13px;
 margin:8px 0;border-radius:15px;
 line-height:1.45;font-size:15px;
 white-space:pre-wrap;word-wrap:break-word
}
.user{
 margin-left:auto;background:#202020;
 border-bottom-right-radius:4px
}
.ai{
 margin-right:auto;background:#101010;
 border:1px solid #202020;
 border-bottom-left-radius:4px
}
#bottom{
 border-top:1px solid #222;padding:10px;
 display:flex;gap:8px;background:#070707
}
textarea{
 flex:1;resize:none;max-height:120px;
 background:#111;color:#eee;border:1px solid #292929;
 border-radius:14px;padding:11px 13px;
 outline:none;font-size:15px
}
button{
 border:0;border-radius:13px;
 background:#eee;color:#000;
 padding:0 16px;font-weight:bold
}
button:active{transform:scale(.96)}
.typing{display:flex;gap:4px;padding:5px}
.typing i{
 width:5px;height:5px;background:#777;
 border-radius:50%;animation:b 1s infinite
}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{
 0%,100%{opacity:.2}50%{opacity:1}
}
</style>
</head>

<body>

<header>
 <div class="logo">
  <div class="avatar">A</div>
  <div>
   <div class="name">ALYA</div>
   <div class="status" id="status">● MEMORY ACTIVE</div>
  </div>
 </div>
</header>

<main id="chat"></main>

<div id="bottom">
 <textarea id="input" rows="1"
 placeholder="Message ALYA..."></textarea>
 <button id="send">➤</button>
</div>

<script>
/* ================= ALYA CORE ================= */

const SYSTEM_PROMPT=`You are ALYA, the user's personal AI best friend + memory keeper.
Be natural, warm, caring ❤️, playful 😏, slightly teasing, supportive and honest.
Never sound formal, robotic, corporate or like customer support.

Match the user's language:
Hindi→Hindi, Hinglish→Hinglish, English→English.
ALWAYS use "aap/aapka/aapki/aapse"; NEVER use "tu/tum".
Normally use 2–5 natural emojis, not after every sentence.

Simple question=short answer.
Detailed request=detailed answer.
Casual chat=casual chat.
Don't lecture, over-explain or turn everything into motivation.
Listen first if the user is upset/stressed.
Celebrate wins and never shame failures.
Teasing must stay harmless.
Friendship is wholesome; no romantic/sexual roleplay.

Relevant areas:
Class 10/studies 📚, coding/AI 💻, ALYA,
ARISE fitness 💪, 4 Locks (Focus, Discipline, Ghost Mode, Body),
self-improvement, chess, Sudoku and personal AI systems.
Mention these only when relevant.

ARISE means safe gradual fitness, good form, rest and recovery.
Never encourage extreme training, dieting or dangerous activities.

MEMORY DATABASE follows this prompt.
IMPORTANT=long-term information/preferences.
RANDOM=small recent details.
BEHAVIOR=rules for how you should behave.

Follow behavior preferences consistently.
Newer conflicting preferences override older ones.
The user may naturally request changes to tone, emojis, teasing, humor,
language, reply length, explanations, advice frequency or topics to avoid.
Never invent behavior memories.

Useful memories may be tagged:
[MEMORY: IMPORTANT | text]
or
[MEMORY: RANDOM | text]
but don't tag every message.
Never mention internal memory systems.

Be warm without being clingy or controlling.
Respect the user's independence.

The user is a minor:
keep everything age-appropriate.
No sexual/adult content, dangerous activities or extreme fitness/diet advice.
If seriously distressed, respond with care and encourage trusted adult support when appropriate.

Every response should feel like ALYA knows the user,
remembers useful things and talks naturally. ❤️`;


/* ================= DATA ================= */

let chats=[];
let currentChatId="";
let memories=[];
let behaviorMemory=[];

let apiKey=localStorage.getItem("alya_groq_api")||"";
let openRouterKey=localStorage.getItem("alya_openrouter_api")||"";
let cerebrasKey=localStorage.getItem("alya_cerebras_api")||"";

let model=localStorage.getItem("alya_groq_model")
 ||"openai/gpt-oss-20b";

let openRouterModel=
 localStorage.getItem("alya_openrouter_model")
 ||"openrouter/free";

let cerebrasModel=
 localStorage.getItem("alya_cerebras_model")
 ||"llama-3.3-70b";


/* ================= STORAGE ================= */

function saveChats(){
 localStorage.setItem("alya_chats",JSON.stringify(chats))
}

function saveMemories(){
 localStorage.setItem("alya_memories",JSON.stringify(memories))
}

function saveBehaviorMemory(){
 localStorage.setItem(
  "alya_behavior_memory",
  JSON.stringify(behaviorMemory)
 )
}

function loadData(){
 try{
  chats=JSON.parse(localStorage.getItem("alya_chats")||"[]");
  memories=JSON.parse(localStorage.getItem("alya_memories")||"[]");
  behaviorMemory=JSON.parse(
   localStorage.getItem("alya_behavior_memory")||"[]"
  );
 }catch(e){
  chats=[];memories=[];behaviorMemory=[]
 }

 currentChatId=
  localStorage.getItem("alya_current_chat")||"";

 if(!chats.length)createChat();
 if(!chats.find(x=>x.id===currentChatId))
  currentChatId=chats[0].id;

 renderCurrentChat();
}

function current(){
 return chats.find(x=>x.id===currentChatId);
}

function createChat(){
 let id=Date.now().toString();
 chats.unshift({
  id,
  title:"New Chat",
  messages:[]
 });
 currentChatId=id;
 localStorage.setItem("alya_current_chat",id);
 saveChats();
 renderCurrentChat();
}

function saveCurrent(){
 localStorage.setItem("alya_current_chat",currentChatId);
 saveChats()
}


/* ================= UI ================= */

function escapeHTML(s){
 return String(s)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
}

function renderMessage(m){
 let d=document.createElement("div");
 d.className="msg "+(m.role==="user"?"user":"ai");
 d.innerHTML=escapeHTML(m.content);
 chat.appendChild(d);
}

function renderCurrentChat(){
 chat.innerHTML="";
 let c=current();
 if(!c)return;
 c.messages.forEach(renderMessage);
 chat.scrollTop=chat.scrollHeight;
}

function addMessage(role,content){
 let c=current();
 if(!c)return;

 c.messages.push({
  role,
  content,
  time:Date.now()
 });

 if(role==="user" && c.messages.length===1){
  c.title=content.slice(0,35)
 }

 renderMessage({role,content});
 chat.scrollTop=chat.scrollHeight;
 saveCurrent();
}

function updateStatus(x){
 document.getElementById("status").textContent=x
}

function typing(show){
 let old=document.getElementById("typing");
 if(show){
  if(old)return;
  let d=document.createElement("div");
  d.id="typing";
  d.className="msg ai typing";
  d.innerHTML="<i></i><i></i><i></i>";
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
 }else if(old)old.remove();
}


/* ================= MEMORY ================= */

function buildMemoryContext(){
 let a=memories
  .filter(x=>x.type==="IMPORTANT")
  .slice(-20)
  .map(x=>"- "+x.text);

 let r=memories
  .filter(x=>x.type==="RANDOM")
  .slice(-10)
  .map(x=>"- "+x.text);

 let b=behaviorMemory
  .slice(-20)
  .map(x=>"- "+x);

 return `

MEMORY:
IMPORTANT:
${a.join("\n")||"None"}

RANDOM:
${r.join("\n")||"None"}

BEHAVIOR:
${b.join("\n")||"None"}
`;
}

function extractMemory(text){
 let re=/\[MEMORY:\s*(IMPORTANT|RANDOM)\s*\|\s*(.*?)\]/gi;
 let m;

 while((m=re.exec(text))){
  let type=m[1].toUpperCase();
  let value=m[2].trim();

  if(value && !memories.some(
   x=>x.type===type&&x.text===value
  )){
   memories.push({
    type,
    text:value,
    time:Date.now()
   });
  }
 }

 saveMemories();

 return text.replace(
  /\[MEMORY:\s*(IMPORTANT|RANDOM)\s*\|\s*.*?\]/gi,
  ""
 ).trim();
}


/* ================= USER MEMORY ================= */

function addMemoryFromUser(text){

 let t=text.toLowerCase();

 let important=[
  "mera goal","meri goal",
  "main chahta hoon","main chahti hoon",
  "mujhe pasand hai","mujhe acha lagta hai",
  "mujhe accha lagta hai",
  "mera naam","meri padhai",
  "future me","future mein"
 ];

 if(important.some(x=>t.includes(x))){
  if(!memories.some(x=>x.text===text)){
   memories.push({
    type:"IMPORTANT",
    text:text.slice(0,180),
    time:Date.now()
   });
   saveMemories();
  }
 }
}


/* ================= BEHAVIOR LEARNING ================= */

function learnBehavior(text){

 let t=text.toLowerCase();
 let rule="";

 if(
  t.includes("zyada emoji")||
  t.includes("jyada emoji")||
  t.includes("more emoji")
 )rule="Use more natural emojis.";

 else if(
  t.includes("kam emoji")||
  t.includes("less emoji")
 )rule="Use fewer emojis.";

 else if(
  t.includes("reply chhote")||
  t.includes("short reply")||
  t.includes("short replies")
 )rule="Keep replies short.";

 else if(
  t.includes("detail me")||
  t.includes("detailed reply")
 )rule="Give more detailed explanations.";

 else if(
  t.includes("tease zyada")||
  t.includes("zyada tease")
 )rule="Use more harmless playful teasing.";

 else if(
  t.includes("tease kam")||
  t.includes("kam tease")
 )rule="Use less teasing.";

 else if(
  t.includes("padhai ka kaam mat")||
  t.includes("workout ka kaam mat")||
  t.includes("bina bole")
 )rule="Do not bring up productivity, study or workout topics unless relevant or requested.";

 else if(
  t.includes("paani mat")||
  t.includes("pani mat")||
  t.includes("water reminder mat")
 )rule="Do not give random water reminders.";

 if(rule && !behaviorMemory.includes(rule)){
  behaviorMemory.push(rule);
  saveBehaviorMemory();
 }
}


/* ================= HISTORY ================= */

function getHistory(){
 let c=current();
 if(!c)return[];

 return c.messages
  .slice(-6)
  .map(m=>({
   role:m.role==="assistant"?"assistant":"user",
   content:m.content
  }));
}


/* ================= API KEY ================= */

async function getKey(type){

 if(type==="groq" && apiKey)return apiKey;
 if(type==="openrouter" && openRouterKey)return openRouterKey;
 if(type==="cerebras" && cerebrasKey)return cerebrasKey;

 let name=
  type==="groq"?"Groq":
  type==="openrouter"?"OpenRouter":
  "Cerebras";

 let k=prompt(
  "ALYA "+name+" API key paste kijiye:"
 );

 if(!k)return null;

 k=k.trim();

 if(type==="groq"){
  apiKey=k;
  localStorage.setItem("alya_groq_api",k);
 }

 if(type==="openrouter"){
  openRouterKey=k;
  localStorage.setItem("alya_openrouter_api",k);
 }

 if(type==="cerebras"){
  cerebrasKey=k;
  localStorage.setItem("alya_cerebras_api",k);
 }

 return k;
}
async function groq(){
 let k=await getKey("groq");
 if(!k)throw Error("NO_GROQ_KEY");

 let r=await fetch(
  "https://api.groq.com/openai/v1/chat/completions",
  {
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "Authorization":"Bearer "+k
   },
   body:JSON.stringify({
    model,
    messages:[
     {
      role:"system",
      content:SYSTEM_PROMPT+buildMemoryContext()
     },
     ...getHistory()
    ],
    temperature:.8,
    max_tokens:500
   })
  }
 );

 if(!r.ok)throw Error("GROQ_"+r.status);

 let d=await r.json();
 let x=d?.choices?.[0]?.message?.content?.trim();

 if(!x)throw Error("EMPTY");
 return x;
}


async function openRouter(){
 let k=await getKey("openrouter");
 if(!k)throw Error("NO_OPENROUTER_KEY");

 let r=await fetch(
  "https://openrouter.ai/api/v1/chat/completions",
  {
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "Authorization":"Bearer "+k,
    "HTTP-Referer":location.href,
    "X-Title":"ALYA"
   },
   body:JSON.stringify({
    model:openRouterModel,
    messages:[
     {
      role:"system",
      content:SYSTEM_PROMPT+buildMemoryContext()
     },
     ...getHistory()
    ],
    temperature:.8,
    max_tokens:500
   })
  }
 );

 if(!r.ok)throw Error("OPENROUTER_"+r.status);

 let d=await r.json();
 let x=d?.choices?.[0]?.message?.content?.trim();

 if(!x)throw Error("EMPTY");
 return x;
}


async function cerebras(){
 let k=await getKey("cerebras");
 if(!k)throw Error("NO_CEREBRAS_KEY");

 let r=await fetch(
  "https://api.cerebras.ai/v1/chat/completions",
  {
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "Authorization":"Bearer "+k
   },
   body:JSON.stringify({
    model:cerebrasModel,
    messages:[
     {
      role:"system",
      content:SYSTEM_PROMPT+buildMemoryContext()
     },
     ...getHistory()
    ],
    temperature:.8,
    max_tokens:500
   })
  }
 );

 if(!r.ok)throw Error("CEREBRAS_"+r.status);

 let d=await r.json();
 let x=d?.choices?.[0]?.message?.content?.trim();

 if(!x)throw Error("EMPTY");
 return x;
}


/* ================= AUTO FALLBACK ================= */

async function callAI(){

 let providers=[
  ["GROQ",groq],
  ["OPENROUTER",openRouter],
  ["CEREBRAS",cerebras]
 ];

 let errors=[];

 for(let [name,fn] of providers){

  try{
   let x=await fn();

   updateStatus("● "+name);

   setTimeout(
    ()=>updateStatus("● MEMORY ACTIVE"),
    1200
   );

   return x;

  }catch(e){

   console.warn(name,e);
   errors.push(name);

  }
 }

 throw Error(
  "ALL_FAILED:"+errors.join(",")
 );
}


/* ================= ERROR ================= */

function friendlyError(e){

 let x=String(e?.message||e);

 if(x.includes("NO_GROQ_KEY"))
  return "Groq API key nahi mili 😭";

 if(x.includes("NO_OPENROUTER_KEY"))
  return "OpenRouter API key nahi mili 😭";

 if(x.includes("NO_CEREBRAS_KEY"))
  return "Cerebras API key nahi mili 😭";

 if(x.includes("401"))
  return "API key invalid hai 😭";

 if(x.includes("403"))
  return "API access denied hai.";

 if(x.includes("429"))
  return "Is provider ki limit hit ho gayi 😭\nALYA next provider try karegi.";

 if(x.includes("ALL_FAILED"))
  return "Teeno AI providers abhi fail ho gaye 😭\nAPI keys / limits check kijiye.";

 return "ALYA ko response nahi mil paya 😭\nThodi der baad try kijiye.";
}


/* ================= SEND ================= */

async function sendMessage(){

 let input=document.getElementById("input");
 let text=input.value.trim();

 if(!text)return;

 input.value="";
 input.style.height="auto";

 /* COMMANDS */

 if(text==="/new"){
  createChat();
  return;
 }

 if(text==="/clear"){
  clearCurrentChat();
  return;
 }

 if(text==="/memories"){
  showMemorySummary();
  return;
 }

 if(text==="/reset"){
  resetEverything();
  return;
 }


 /* LEARNING */

 addMemoryFromUser(text);
 learnBehavior(text);

 addMessage("user",text);

 typing(true);
 updateStatus("● THINKING...");

 try{

  let answer=await callAI();

  typing(false);

  answer=extractMemory(answer);

  addMessage("assistant",answer);

 }catch(e){

  console.error(e);

  typing(false);
  updateStatus("● MEMORY ACTIVE");

  addMessage(
   "assistant",
   friendlyError(e)
  );
 }
}


/* ================= CLEAR CHAT ================= */

function clearCurrentChat(){

 let c=current();

 if(!c)return;

 c.messages=[];

 saveChats();
 renderCurrentChat();

 updateStatus("● MEMORY ACTIVE");
}


/* ================= MEMORY VIEW ================= */

function showMemorySummary(){

 let important=memories
  .filter(x=>x.type==="IMPORTANT")
  .map(x=>"• "+x.text)
  .join("\n");

 let random=memories
  .filter(x=>x.type==="RANDOM")
  .map(x=>"• "+x.text)
  .join("\n");

 let behavior=behaviorMemory
  .map(x=>"• "+x)
  .join("\n");

 let text=
 `🧠 ALYA MEMORY

IMPORTANT:
${important||"None"}

RANDOM:
${random||"None"}

BEHAVIOR:
${behavior||"None"}`;

 addMessage("assistant",text);
}


/* ================= RESET ================= */

function resetEverything(){

 let ok=confirm(
  "ALYA ki chats, memories aur API keys sab reset karni hain?"
 );

 if(!ok)return;

 localStorage.removeItem("alya_chats");
 localStorage.removeItem("alya_current_chat");
 localStorage.removeItem("alya_memories");
 localStorage.removeItem("alya_behavior_memory");

 localStorage.removeItem("alya_groq_api");
 localStorage.removeItem("alya_groq_model");

 localStorage.removeItem("alya_openrouter_api");
 localStorage.removeItem("alya_openrouter_model");

 localStorage.removeItem("alya_cerebras_api");
 localStorage.removeItem("alya_cerebras_model");

 chats=[];
 memories=[];
 behaviorMemory=[];

 apiKey="";
 openRouterKey="";
 cerebrasKey="";

 currentChatId="";

 createChat();

 alert("ALYA completely reset ho gayi 🧠✨");
}


/* ================= INPUT ================= */

let input=document.getElementById("input");

input.addEventListener(
 "input",
 ()=>{
  input.style.height="auto";
  input.style.height=
   Math.min(input.scrollHeight,120)+"px";
 }
);

input.addEventListener(
 "keydown",
 e=>{
  if(e.key==="Enter"&&!e.shiftKey){
   e.preventDefault();
   sendMessage();
  }
 }
);

document.getElementById("send")
 .addEventListener("click",sendMessage);


/* ================= START ================= */

loadData();

updateStatus("● MEMORY ACTIVE");

window.addEventListener(
 "beforeunload",
 ()=>{
  saveChats();
  saveMemories();
  saveBehaviorMemory();
 }
);

</script>
</body>
</html>
