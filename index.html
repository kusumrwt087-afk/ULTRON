<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon.png">
<title>ULTRON V6 // GOD MODE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#ff1a1a;font-family:monospace;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.top{padding:14px 18px;border-bottom:1px solid #330000;display:flex;justify-content:space-between;align-items:center;background:#050000}
.top b{letter-spacing:5px;color:#ff2222;font-size:14px}
.top div{display:flex;gap:6px}
.top button{background:transparent;border:1px solid #660000;color:#ff6666;padding:6px 14px;font-family:monospace;cursor:pointer;font-size:11px}
.top button.on{background:#ff0000;color:#000;box-shadow:0 0 15px #ff0000;border-color:#ff0000}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.eye{width:260px;height:260px;border-radius:50%;border:2px solid #ff0000;box-shadow:0 0 70px #ff0000,inset 0 0 70px #ff0000;background:radial-gradient(circle,#ff2a2a 0%,#8a0000 35%,#000 70%);transition:.3s}
.eye.think{animation:pulse.6s infinite alternate}
@keyframes pulse{from{box-shadow:0 0 30px #ff0000}to{box-shadow:0 0 140px #ff0000}}
.status{margin-top:26px;letter-spacing:5px;font-size:11px;color:#ff4444}
.chat{height:42vh;overflow-y:auto;padding:14px;background:#050505;border-top:1px solid #220000}
.msg{padding:11px 14px;margin:9px 0;border-left:3px solid #ff0000;background:#111;font-size:14px;line-height:1.6;white-space:pre-wrap}
.msg.user{border-left-color:#444;color:#ccc;text-align:right;background:#0e0e0e}
.inputbar{display:flex;gap:8px;padding:12px;background:#000;border-top:1px solid #222}
.inputbar input{flex:1;background:#111;border:1px solid #333;color:#fff;padding:16px;font-family:monospace;outline:none;font-size:15px}
.inputbar button{background:#ff0000;border:none;color:#000;font-weight:900;padding:0 24px;font-size:22px;cursor:pointer}
.inputbar button.mic{background:#111;color:#ff0000;border:1px solid #ff0000;font-size:18px}
</style>
</head>
<body>
<div class="top"><b>ULTRON V6 GOD</b><div><button id="voiceModeBtn" onclick="toggleUnlimited()">VOICE: OFF</button><button onclick="resetKey()">RESET</button></div></div>
<div class="center"><div id="eye" class="eye"></div><div id="st" class="status">SYSTEM READY - COMPOUND MINI LIVE</div></div>
<div id="chat" class="chat"><div class="msg">ULTRON V6 GOD MODE - groq/compound-mini (Free + Built-in Live Search) online hai Kiyotaka.</div></div>
<div class="inputbar">
<input id="inp" placeholder="Hindi ya English me bolo..." onkeydown="if(event.key==='Enter')send()">
<button onclick="send()">></button>
<button class="mic" onclick="voiceIn()">🎤</button>
</div>
<script>
let apiKey=localStorage.getItem('ultron_groq_key');
if(!apiKey){askKey();}
function askKey(){let k=prompt("Apni Groq API Key daal (gsk_...):");if(k){apiKey=k.trim();localStorage.setItem('ultron_groq_key',apiKey);}}
function resetKey(){localStorage.removeItem('ultron_groq_key');localStorage.removeItem('ultron_memory');apiKey=null;alert('Memory clear ho gayi!');askKey();location.reload();}
const chatEl=document.getElementById('chat'),eye=document.getElementById('eye'),st=document.getElementById('st');
let unlimitedMode=false, isListening=false;
let memory=JSON.parse(localStorage.getItem('ultron_memory')||'[]');

async function searchDuck(query){
  try{
    let res = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`);
    let data = await res.json();
    let out = [];
    if(data.AbstractText) out.push(data.AbstractText);
    if(data.Results && data.Results.length) out.push(...data.Results.slice(0,3).map(r=>r.Text));
    if(data.RelatedTopics) out.push(...data.RelatedTopics.slice(0,4).map(t=>t.Text||'').filter(Boolean));
    return out.join('\n').slice(0,3000);
  }catch(e){ return ''; }
}
async function getLiveKnowledge(q){
  st.innerText='DUCK + COMPOUND SEARCHING...';
  let d = await searchDuck(q);
  if(d) return `[DUCK BACKUP DATA]:\n${d}`;
  return '';
}

function toggleUnlimited(){
  unlimitedMode=!unlimitedMode;
  let btn=document.getElementById('voiceModeBtn');
  btn.innerText=unlimitedMode?'VOICE: ON':'VOICE: OFF';
  btn.classList.toggle('on',unlimitedMode);
  if(unlimitedMode){ addMsg('UNLIMITED VOICE ON',''); voiceIn(); }
  else { speechSynthesis.cancel(); }
}
let mainVoice=null;
function loadVoices(){
 let voices=speechSynthesis.getVoices();
 mainVoice = voices.find(v=>v.name.includes('Microsoft Ravi')) || voices.find(v=>v.name.includes('Google UK English Male')) || voices.find(v=>v.lang==='en-IN') || voices[0];
}
speechSynthesis.onvoiceschanged=loadVoices; loadVoices(); setTimeout(loadVoices,1200);
function cleanForSpeech(t){return t.replace(/\*\*/g,'').replace(/[*#_`~<>|]/g,'').replace(/[\u{1F600}-\u{1F6FF}]/gu,'').replace(/https?:\/\/\S+/g,'').replace(/\s+/g,' ').trim();}
function cleanForDisplay(t){return t.replace(/\*\*/g,'').replace(/##/g,'').trim();}
function speakLong(text){
 speechSynthesis.cancel();
 let clean=cleanForSpeech(text); if(!clean){ if(unlimitedMode) setTimeout(()=>voiceIn(),600); return; }
 let sentences=clean.match(/[^.!?।]+[.!?।]?/g) || [clean]; let i=0;
 function next(){
   if(i>=sentences.length){ st.innerText='SYSTEM READY - COMPOUND MINI LIVE'; if(unlimitedMode) setTimeout(()=>voiceIn(),600); return; }
   let part=sentences[i].trim(); if(!part){i++; next(); return;}
   let u=new SpeechSynthesisUtterance(part); if(mainVoice) u.voice=mainVoice;
   u.lang=/[ऀ-ॿ]/.test(part)?'hi-IN':'en-IN'; u.rate=0.88; u.pitch=0.85;
   u.onstart=()=>{st.innerText='SPEAKING...'; eye.classList.add('think');}
   u.onend=()=>{i++; next();}
   speechSynthesis.speak(u);
 }
 next();
}
function addMsg(t,cls){let d=document.createElement('div');d.className='msg '+(cls||'');d.innerText=cleanForDisplay(t);chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;}
// === ULTRON V6 - PERSONAL GOD MEMORY V3 - UNLIMITED ===
let ultronMemory = JSON.parse(localStorage.getItem('ultron_v6_god_memory') || '{"personal":[],"facts":[],"chats":[]}');

function extractPersonalInfo(text){
  let t = text.toLowerCase();
  let keywords = ['mera naam','my name','meri age','mai rehta','i live','mera kaam','i work','meri gf','my gf','meri pasand','i like','mujhe pasand','yaad rakh','remember this','personal'];
  return keywords.some(k=>t.includes(k));
}

function saveToMemory(userMsg, aiMsg){
  // PERSONAL MEMORY
  if(extractPersonalInfo(userMsg)){
    ultronMemory.personal.push(userMsg);
    if(ultronMemory.personal.length > 100) ultronMemory.personal.shift();
  }
  // FACTS
  ultronMemory.facts.push(userMsg.substring(0,150)); // chota summary
  if(ultronMemory.facts.length > 100) ultronMemory.facts.shift();

  // CHATS - 500 chats tak yaad rakhega = BAHUT BADI MEMORY
  ultronMemory.chats.push({u: userMsg, a: aiMsg, t: new Date().toLocaleString()});
  if(ultronMemory.chats.length > 500) ultronMemory.chats.shift();

  localStorage.setItem('ultron_v6_god_memory', JSON.stringify(ultronMemory));
  console.log("Memory Saved:", ultronMemory.chats.length + " chats");
}

function getMemoryContext(){
  let personal = ultronMemory.personal.slice(-30).join(' | ');
  let chats = ultronMemory.chats.slice(-15).map(c=>`User said: ${c.u} | You replied: ${c.a}`).join('\n');
  return `USER PERSONAL SECRETS (NEVER FORGET, NEVER SHARE): ${personal}\n\nRECENT CONVERSATIONS (15):\n${chats}`;
}

function clearUltronMemory(){
  if(confirm('Saari memory delete karni hai?')){
    localStorage.removeItem('ultron_v6_god_memory');
    location.reload();
  }
      }
async function send(){
 let inp=document.getElementById('inp');let q=inp.value.trim();if(!q)return;
 q=q.replace(/(\b\w+\b)(?:\s+\1\b)+/gi,'$1');
 addMsg(q,'user');inp.value='';eye.classList.add('think');st.innerText='COMPOUND THINKING...';
 if(!apiKey){askKey();if(!apiKey){eye.classList.remove('think');return;}}
 try{
  let liveData = await getLiveKnowledge(q);
  let memContext=getMemoryContext();
  let res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
   method:'POST',
   headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
   body:JSON.stringify({
    model:'groq/compound-mini',
    messages:[
     {role:'system',content:`You are ULTRON V6 GOD MODE. You HAVE built-in web search tool - you MUST use it for any 2025-2026 question like IPL 2026, news, score, price. 1. NEVER use LaTeX, NEVER use \\frac. Write math as plain text: sin = opposite/hypotenuse. 2. For IPL 2026: Winner is Royal Challengers Bengaluru (RCB) beat Gujarat Titans by 5 wickets on 31 May 2026 Final, Kohli 75* not out. 3. Reply same language as user. MEMORY: ${memContext} EXTRA LIVE: ${liveData}`},
     {role:'user',content:q}
    ],
    max_tokens:800
   })
  });
  let data=await res.json();if(!res.ok)throw new Error(data.error?data.error.message:JSON.stringify(data));
  let ans=data.choices[0].message.content;
  saveToMemory(q,ans);
  addMsg(ans,'');speakLong(ans);
 }catch(e){addMsg('ERROR: '+e.message,'');}
 finally{eye.classList.remove('think');st.innerText='SYSTEM READY - COMPOUND MINI LIVE';}
}
function voiceIn(){
 if(isListening) return;
 let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){alert('Mic not supported');return;}
 let r=new SR(); r.lang='hi-IN'; r.continuous=false; r.interimResults=false; r.maxAlternatives=1;
 let finalText=""; isListening=true;
 r.start(); st.innerText='SUN RAHA HU...'; eye.classList.add('think');
 r.onresult=(e)=>{ finalText=e.results[0][0].transcript; finalText=finalText.replace(/(\b\w+\b)(?:\s+\1\b)+/gi,'$1'); document.getElementById('inp').value=finalText; };
 r.onend=()=>{ isListening=false; st.innerText='SYSTEM READY - FIXED'; eye.classList.remove('think'); if(finalText.trim()) send(); else if(unlimitedMode) setTimeout(()=>voiceIn(),600); };
 r.onerror=()=>{ isListening=false; st.innerText='SYSTEM READY - FIXED'; eye.classList.remove('think'); };
}
</script>
</body>
</html>
