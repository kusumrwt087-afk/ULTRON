<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.5">
<meta name="theme-color" content="#050505">
<meta name="description" content="ALYA — Personal AI & Memory Keeper">
<link rel="manifest" href="manifest.json">
<title>ALYA — Personal AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050505;
  color:#f5f5f5;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  display:flex;
  flex-direction:column;
}

.header{
  height:76px;
  min-height:76px;
  display:flex;
  align-items:center;
  gap:13px;
  padding:10px 15px;
  background:#080808;
  border-bottom:1px solid #202020;
  box-shadow:0 4px 20px rgba(0,0,0,.35);
}

.avatar{
  width:48px;
  height:48px;
  min-width:48px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  font-weight:800;
  color:#fff;
  background:#111;
  border:1px solid #444;
  box-shadow:0 0 15px rgba(255,255,255,.05);
}

.info{
  min-width:0;
}

.title{
  font-size:20px;
  font-weight:800;
  letter-spacing:1.5px;
}

.sub{
  margin-top:2px;
  color:#888;
  font-size:9px;
  letter-spacing:1.5px;
}

.status{
  margin-top:4px;
  color:#777;
  font-size:9px;
  letter-spacing:1px;
}

#chat{
  flex:1;
  overflow-y:auto;
  padding:18px 13px 20px;
  scroll-behavior:smooth;
}

#chat::-webkit-scrollbar{
  width:4px;
}

#chat::-webkit-scrollbar-thumb{
  background:#333;
  border-radius:10px;
}

.message{
  width:100%;
  display:flex;
  margin:0 0 13px;
}

.message.user{
  justify-content:flex-end;
}

.message.assistant{
  justify-content:flex-start;
}

.bubble{
  max-width:86%;
  padding:11px 13px;
  border-radius:15px;
  font-size:14px;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user .bubble{
  background:#f2f2f2;
  color:#080808;
  border-bottom-right-radius:4px;
}

.assistant .bubble{
  background:#111;
  color:#eee;
  border:1px solid #252525;
  border-bottom-left-radius:4px;
}

.time{
  display:block;
  margin-top:5px;
  font-size:8px;
  opacity:.45;
  text-align:right;
}

.typing{
  display:flex;
  gap:4px;
  align-items:center;
  padding:12px 14px;
}

.dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#888;
  animation:blink 1s infinite;
}

.dot:nth-child(2){animation-delay:.15s}
.dot:nth-child(3){animation-delay:.3s}

@keyframes blink{
  0%,80%,100%{opacity:.25;transform:scale(.8)}
  40%{opacity:1;transform:scale(1)}
}

.inputArea{
  min-height:72px;
  display:flex;
  align-items:flex-end;
  gap:9px;
  padding:9px 10px 10px;
  background:#080808;
  border-top:1px solid #202020;
}

#input{
  flex:1;
  min-height:53px;
  max-height:145px;
  resize:none;
  overflow-y:auto;
  outline:none;
  border:1px solid #282828;
  border-radius:15px;
  padding:15px 14px;
  background:#101010;
  color:#fff;
  font-size:14px;
  line-height:1.35;
}

#input:focus{
  border-color:#555;
}

#input::placeholder{
  color:#666;
}

#send{
  width:53px;
  height:53px;
  min-width:53px;
  border:1px solid #333;
  border-radius:15px;
  background:#eee;
  color:#080808;
  font-size:21px;
  font-weight:bold;
  cursor:pointer;
}

#send:active{
  transform:scale(.95);
}

#send:disabled{
  opacity:.35;
}

.empty{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#555;
  font-size:12px;
  letter-spacing:.5px;
}

@media(max-width:420px){
  .header{
    height:70px;
    min-height:70px;
  }

  .avatar{
    width:44px;
    height:44px;
    min-width:44px;
  }

  .title{
    font-size:18px;
  }

  .bubble{
    max-width:90%;
    font-size:13.5px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="avatar">A</div>

    <div class="title">ALYA</div>
    <div class="sub">PERSONAL AI • MEMORY KEEPER</div>
    <div class="status" id="status">● MEMORY ACTIVE</div>

<main id="chat"></main>

<div class="inputArea">

let chats = [];
let currentChatId = "";
let memories = [];

let apiKey = localStorage.getItem("alya_groq_api") || "";
let model = localStorage.getItem("alya_groq_model") || "openai/gpt-oss-20b";

try{
  chats = JSON.parse(localStorage.getItem("alya_chats") || "[]");
}catch(e){
  chats = [];
}

try{
  memories = JSON.parse(localStorage.getItem("alya_memories") || "[]");
}catch(e){
  memories = [];
}

if(!Array.isArray(chats)) chats=[];
if(!Array.isArray(memories)) memories=[];

currentChatId =
  localStorage.getItem("alya_current_chat") || "";

function getCurrentChat(){
  return chats.find(c => c.id === currentChatId);
}

function createChat(){
  const id = "chat_" + Date.now();

  chats.push({
    id:id,
    title:"ALYA Chat",
    messages:[],
    created:Date.now()
  });

  currentChatId=id;
  saveChats();
}

if(!currentChatId || !getCurrentChat()){
  createChat();
}

function saveChats(){
  localStorage.setItem(
    "alya_chats",
    JSON.stringify(chats)
  );

  localStorage.setItem(
    "alya_current_chat",
    currentChatId
  );
}

function saveMemories(){
  localStorage.setItem(
    "alya_memories",
    JSON.stringify(memories)
  );
}

function escapeHTML(text){
  const div=document.createElement("div");
  div.textContent=text;
  return div.innerHTML;
}

function renderCurrentChat(){

  const chat=document.getElementById("chat");
  chat.innerHTML="";

  const current=getCurrentChat();

  if(!current || !current.messages.length){
    chat.innerHTML=`
      <div class="empty">
        ALYA is ready.<br>
        Start a conversation.
      </div>
    `;
    return;
  }

  current.messages.forEach(m=>{
    renderMessage(
      m.role,
      m.content,
      false,
      m.time
    );
  });

  chat.scrollTop=chat.scrollHeight;
}

function renderMessage(
  role,
  text,
  scroll=true,
  time=null
){

  const chat=document.getElementById("chat");

  const empty=chat.querySelector(".empty");
  if(empty) empty.remove();

  const wrapper=document.createElement("div");
  wrapper.className="message "+role;

  const bubble=document.createElement("div");
  bubble.className="bubble";

  bubble.innerHTML=
    escapeHTML(text).replace(/\n/g,"<br>");

  const stamp=document.createElement("span");
  stamp.className="time";

  stamp.textContent =
    time ||
    new Date().toLocaleTimeString(
      [],
      {hour:"2-digit",minute:"2-digit"}
    );

  bubble.appendChild(stamp);
  wrapper.appendChild(bubble);
  chat.appendChild(wrapper);

  if(scroll){
    chat.scrollTop=chat.scrollHeight;
  }
}

function addToCurrentChat(role,text){

  const current=getCurrentChat();

  if(!current)return;

  current.messages.push({
    role:role,
    content:text,
    time:new Date().toLocaleTimeString(
      [],
      {hour:"2-digit",minute:"2-digit"}
    )
  });

  if(
    role==="user" &&
    current.title==="ALYA Chat"
  ){
    current.title =
      text.length>25
      ? text.slice(0,25)+"..."
      : text;
  }

  saveChats();
}

function extractMemory(text){

  const regex =
    /\[MEMORY:\s*(IMPORTANT|RANDOM)\s*\|\s*([\s\S]*?)\]/gi;

  let match;

  while((match=regex.exec(text))!==null){

    const type=match[1].toUpperCase();
    const value=match[2].trim();

    if(
      value &&
      !memories.some(
        m=>m.text.toLowerCase()===value.toLowerCase()
      )
    ){

      memories.push({
        type:type,
        text:value,
        date:new Date().toLocaleDateString()
      });
    }
  }

  saveMemories();

  return text
    .replace(regex,"")
    .trim();
}

function updateStatus(text){
  document.getElementById("status").textContent=text;
}

renderCurrentChat();
saveChats();
saveMemories();


async function getApiKey(){

  if(apiKey)return apiKey;

  const key=prompt(
    "Apni Groq API key paste kijiye (gsk_...):"
  );

  if(!key || !key.trim()){
    updateStatus("● API KEY REQUIRED");
    return "";
  }

  apiKey=key.trim();

  localStorage.setItem(
    "alya_groq_api",
    apiKey
  );

  updateStatus("● MEMORY ACTIVE");

  return apiKey;
}


function buildMemoryContext(){

  if(!memories.length){
    return "\n\nMEMORY DATABASE: No saved memories yet.";
  }

  let important=[];
  let random=[];

  memories.forEach(m=>{
    if(m.type==="IMPORTANT"){
      important.push(m.text);
    }else{
      random.push(m.text);
    }
  });

  let result="\n\nALYA MEMORY DATABASE:";

  if(important.length){
    result+="\n\nIMPORTANT MEMORIES:";

    important.forEach((m,i)=>{
      result+="\n"+(i+1)+". "+m;
    });
  }

  if(random.length){
    result+="\n\nRANDOM MEMORIES:";

    random.forEach((m,i)=>{
      result+="\n"+(i+1)+". "+m;
    });
  }

  return result;
}


function addMemoryFromUser(text){

  const lower=text.toLowerCase();

  const importantWords=[
    "remember",
    "yaad rakh",
    "yaad rakhna",
    "save this",
    "note this",
    "important hai",
    "mera goal",
    "my goal",
    "main chahta",
    "main chahti",
    "mujhe pasand",
    "mujhe nahi pasand",
    "from now",
    "future me",
    "going forward"
  ];

  const randomWords=[
    "aaj",
    "today",
    "abhi",
    "recently",
    "kal",
    "yesterday",
    "just",
    "abhi abhi"
  ];

  let type="";

  if(
    importantWords.some(
      x=>lower.includes(x)
    )
  ){
    type="IMPORTANT";
  }else if(
    randomWords.some(
      x=>lower.includes(x)
    )
  ){
    type="RANDOM";
  }

  if(!type)return;

  const value=text.trim();

  if(value.length<4)return;

  if(
    !memories.some(
      m=>m.text.toLowerCase()===value.toLowerCase()
    )
  ){

    memories.push({
      type:type,
      text:value,
      date:new Date().toLocaleDateString()
    });

    saveMemories();
  }
}


function getHistory(){

  const current=getCurrentChat();

  if(!current)return[];

  return current.messages.map(m=>({
    role:
      m.role==="assistant"
      ?"assistant"
      :"user",
    content:m.content
  }));
}


async function callGrok(){

  const key=await getApiKey();

  if(!key){
    throw new Error("NO_API_KEY");
  }

  const history=getHistory();
  const memory=buildMemoryContext();

  const messages=[
    {
      role:"system",
      content:SYSTEM_PROMPT+memory
    },
    ...history
  ];

  const response=await fetch(
    "https://api.groq.com/openai/v1/chat/completions",
    {
      method:"POST",

      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+key
      },

      body:JSON.stringify({
        model:model,
        messages:messages,
        temperature:0.9,
        max_tokens:900
      })
    }
  );

  if(!response.ok){

    const errorText=await response.text();

    throw new Error(
      "HTTP "+response.status+
      " | "+errorText
    );
  }

  const data=await response.json();

  const reply=
    data?.choices?.[0]?.message?.content?.trim();

  if(!reply){
    throw new Error("EMPTY_RESPONSE");
  }

  return reply;
}


function showTyping(){

  const chat=document.getElementById("chat");

  const wrapper=document.createElement("div");

  wrapper.className="message assistant";
  wrapper.id="typingMessage";

  wrapper.innerHTML=`
    <div class="bubble typing">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  `;

  chat.appendChild(wrapper);

  chat.scrollTop=chat.scrollHeight;
}


function removeTyping(){

  const typing=
    document.getElementById("typingMessage");

  if(typing)typing.remove();
}


function friendlyError(error){

  console.error(
    "FULL GROQ ERROR:",
    error
  );

  if(error.message==="NO_API_KEY"){
    return "Groq API key nahi mili 😅";
  }

  if(error.message==="EMPTY_RESPONSE"){
    return "Groq ne empty response diya 😅";
  }

  const raw=error.message||"";

  if(raw.includes("401")){
    return "❌ Groq API key invalid hai. /reset karke valid gsk_... key dobara paste kijiye.";
  }

  if(raw.includes("429")){
    return "⏳ Groq rate limit hit ho gayi. Thodi der baad phir try kijiye.";
  }

  try{

    const separator=raw.indexOf(" | ");

    const body=
      separator>=0
      ?raw.slice(separator+3)
      :raw;

    const data=JSON.parse(body);

    const message=
      typeof data?.error==="string"
      ?data.error
      :data?.error?.message
      ||data?.message
      ||"Unknown Groq API error";

    return "Groq API Error: "+message;

  }catch(e){}

  return "Groq API Error: "+raw;
}


async function sendMessage(){

  const input=
    document.getElementById("input");

  const send=
    document.getElementById("send");

  const text=input.value.trim();

  if(!text)return;


  if(text==="/new"){

    input.value="";

    createChat();
    renderCurrentChat();

    updateStatus("● NEW CHAT");

    setTimeout(()=>{
      updateStatus("● MEMORY ACTIVE");
    },1200);

    return;
  }


  if(text==="/clear"){

    input.value="";

    clearCurrentChat();

    return;
  }


  if(text==="/memories"){

    input.value="";

    showMemorySummary();

    return;
  }


  if(text==="/reset"){

    input.value="";

    resetEverything();

    return;
  }


  const current=getCurrentChat();

  if(!current)return;

  input.value="";
  input.style.height="53px";
  send.disabled=true;

  addMemoryFromUser(text);

  addToCurrentChat(
    "user",
    text
  );

  renderMessage(
    "user",
    text
  );

  showTyping();


  try{

    const rawReply=
      await callGrok();

    removeTyping();

    const reply=
      extractMemory(rawReply);

    addToCurrentChat(
      "assistant",
      reply
    );

    renderMessage(
      "assistant",
      reply
    );

    updateStatus("● MEMORY ACTIVE");

  }catch(error){

    removeTyping();

    const errorMessage=
      friendlyError(error);

    addToCurrentChat(
      "assistant",
      errorMessage
    );

    renderMessage(
      "assistant",
      errorMessage
    );

    updateStatus("● CONNECTION ERROR");

    console.error(error);
  }

  send.disabled=false;
  input.focus();
}


function clearCurrentChat(){

  const current=getCurrentChat();

  if(!current)return;

  if(!confirm("Current chat clear karna hai?")){
    return;
  }

  current.messages=[];
  current.title="ALYA Chat";

  saveChats();
  renderCurrentChat();

  updateStatus("● CHAT CLEARED");

  setTimeout(()=>{
    updateStatus("● MEMORY ACTIVE");
  },1200);
}


function showMemorySummary(){

  const current=getCurrentChat();

  if(!current)return;

  let text="";

  if(!memories.length){

    text=
      "Abhi ALYA memory database mein kuch saved nahi hai.";

  }else{

    let important=
      memories.filter(
        m=>m.type==="IMPORTANT"
      );

    let random=
      memories.filter(
        m=>m.type==="RANDOM"
      );

    text="ALYA MEMORY DATABASE\n\n";

    if(important.length){

      text+="IMPORTANT:\n";

      important.forEach((m,i)=>{
        text+=(i+1)+". "+m.text+"\n";
      });

      text+="\n";
    }

    if(random.length){

      text+="RANDOM:\n";

      random.forEach((m,i)=>{
        text+=(i+1)+". "+m.text+"\n";
      });
    }
  }

  addToCurrentChat(
    "assistant",
    text
  );

  renderMessage(
    "assistant",
    text
  );
}


function resetEverything(){

  if(
    !confirm(
      "ALYA ka pura data reset karna hai?"
    )
  ){
    return;
  }

  localStorage.removeItem("alya_chats");
  localStorage.removeItem("alya_current_chat");
  localStorage.removeItem("alya_memories");

  localStorage.removeItem("alya_groq_api");
  localStorage.removeItem("alya_groq_model");

  /* Purani xAI key bhi remove */
  localStorage.removeItem("alya_grok_api");
  localStorage.removeItem("alya_grok_model");

  chats=[];
  memories=[];

  apiKey="";

  model="openai/gpt-oss-20b";

  currentChatId="";

  createChat();
  renderCurrentChat();

  updateStatus("● API KEY NEEDED");

  setTimeout(()=>{

    alert(
      "ALYA reset ho gayi.\n\n"+
      "Ab next message par Groq API key maangegi."
    );

  },100);
}


function resizeInput(){

  const input=
    document.getElementById("input");

  input.style.height="auto";

  input.style.height=
    Math.min(
      input.scrollHeight,
      145
    )+"px";
}


document
  .getElementById("input")
  .addEventListener(
    "input",
    resizeInput
  );


document
  .getElementById("input")
  .addEventListener(
    "keydown",
    function(e){

      if(
        e.key==="Enter" &&
        !e.shiftKey
      ){

        e.preventDefault();

        sendMessage();
      }

    }
  );


document
  .getElementById("send")
  .addEventListener(
    "click",
    sendMessage
  );


window.addEventListener(
  "beforeunload",
  function(){

    saveChats();
    saveMemories();

  }
);


saveChats();
saveMemories();
renderCurrentChat();


if(!apiKey){

  updateStatus(
    "● API KEY NEEDED"
  );

}else{

  updateStatus(
    "● MEMORY ACTIVE"
  );
}

</script>
